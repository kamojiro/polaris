<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Composer mockup — 採用案(2026-09-14確定)</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: #f7f6f3;
    padding: 40px 24px;
    color: #2b2b28;
  }
  .composer-wrap { max-width: 700px; }
  .composer {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    border: 1px solid #e4e2dc;
    border-radius: 24px;
    padding: 10px 16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    position: relative;
  }
  .composer input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 15px;
    background: transparent;
    color: #2b2b28;
  }
  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    cursor: pointer;
    color: #6b6a66;
    flex-shrink: 0;
    background: transparent;
    border: none;
  }
  .icon-btn:hover { background: #f0efe9; }
  .icon-btn svg { width: 18px; height: 18px; }
  .send-btn {
    background: #cbb896;
    color: #fff;
    border-radius: 16px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    flex-shrink: 0;
    cursor: pointer;
    border: none;
  }
  .chevron-svg { width: 10px; height: 10px; color: #9a988f; }
  .menu {
    position: absolute;
    bottom: 46px;
    right: 60px;
    background: #fff;
    border: 1px solid #e4e2dc;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    padding: 6px;
    width: 200px;
  }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
    color: #2b2b28;
  }
  .menu-item:hover { background: #f5f3ee; }
  .menu-item svg { width: 16px; height: 16px; color: #6b6a66; flex-shrink: 0; }
  .menu-item .label { display: flex; flex-direction: column; }
  .menu-item .sub { font-size: 10.5px; color: #a19e93; }
  .menu-item.active svg { color: #cb8a4a; }
  h2 { font-size: 13px; color: #7a7972; margin: 40px 0 10px; }
</style>
</head>
<body>

<h2>通常状態(展開メニュー付き)</h2>
<div class="composer-wrap">
  <div class="composer">
    <button class="icon-btn">＋</button>
    <input placeholder="メッセージを入力...">
    <button class="icon-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 3v2M12 19v2M6 8v8M18 8v8M9 5v14M15 5v14"/></svg>
      <svg class="chevron-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
    </button>
    <button class="send-btn">送信</button>
    <div class="menu">
      <div class="menu-item active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a7 7 0 0 1-14 0"/></svg>
        <div class="label">話す<span class="sub">押している間だけ録音</span></div>
      </div>
      <div class="menu-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="2"/><path d="M12 5v-2M12 21v-2M5 12h-2M21 12h-2M7.5 7.5l-1.4-1.4M17.9 17.9l-1.4-1.4M7.5 16.5l-1.4 1.4M17.9 6.1l-1.4 1.4"/></svg>
        <div class="label">常時待受<span class="sub">「かもも」で自動起動</span></div>
      </div>
    </div>
  </div>
</div>

<h2>常時待受モード中</h2>
<div class="composer-wrap">
  <div class="composer">
    <button class="icon-btn">＋</button>
    <input placeholder="「かもも」と話しかけてください..." style="color:#a19e93;">
    <button class="icon-btn" style="color:#cb8a4a; background:#fbf0e0;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v2M12 19v2M6 8v8M18 8v8M9 5v14M15 5v14"/></svg>
    </button>
    <button class="send-btn">送信</button>
  </div>
</div>

</body>
</html>
